<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>BikSafe backend benchmark</title></head>
<body>

  <canvas id="sample" width="640" height="384" hidden></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script type="module" src="./backend-benchmark.js"></script>
</body>
</html>
